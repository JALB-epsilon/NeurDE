2:
  hidden_dim: 64
  num_layers: 4
  logit_clip: 15.0
  project_feq_moments: true
  enforce_sod_symmetry: false
  feq_nullspace_gamma_mode: fixed
  feq_nullspace_gamma: 1.0
  geq_mode: conservative
  geq_nullspace_gamma_mode: fixed
  geq_nullspace_gamma: 1.0
  learn_feq: true
  data_dir: data_base/SOD_case2.h5
  stage1:
    learn_feq: true
    geq_mode: conservative
    feq_nullspace_gamma_mode: fixed
    feq_nullspace_gamma: 1.0
    geq_nullspace_gamma_mode: fixed
    geq_nullspace_gamma: 1.0
    epochs: 3000
    lr: 0.0001
    geq_moment_weight: 0.1
    model_dir: results_todo/case2/geq_conservative_feq_learned/stage1
    scheduler: CosineAnnealingWarmRestarts
    scheduler_config:
      CosineAnnealingWarmRestarts:
        T_0: 1500
        T_mult: 2
        eta_min: 0.000005
  stage2:
    learn_feq: true
    geq_mode: conservative
    feq_mode: learned
    feq_nullspace_gamma_mode: fixed
    feq_nullspace_gamma: 1.0
    geq_nullspace_gamma_mode: fixed
    geq_nullspace_gamma: 0.1
    epochs: 1000
    lr: 1.0e-5
    model_dir: results_todo/case2/geq_conservative_feq_learned/stage2
    N: 25
    batch_size: 1
    rollout_start: 25
    rollout_warmup_batches: 0
    detach_interval: 0
    loss_stride: 1
    feq_collision_mix_start: 1.0
    feq_collision_mix_warmup_batches: 0
    feq_collision_mix_eval: 1.0
    geq_collision_mix_start: 1.0
    geq_collision_mix_warmup_batches: 0
    equilibrium_anchor_weight: 0.0
    geq_moment_weight: 0.0
    grad_clip_norm: 1.0
    skip_nonfinite_batches: true
    TVD: true
    tvd_weight: 15.0
    curvature_weight: 0.0
    rollout_source: predicted
    loss_target: equilibrium
    plot_frequency: 25
    benchmark_steps: 25
    long_rollout_eval: true
    long_rollout_eval_frequency: 5
    long_rollout_eval_min_rollout: 25
    long_rollout_eval_start: 500
    long_rollout_eval_steps: 500
    long_rollout_save_top_k: 3
    scheduler: OneCycleLR
    scheduler_config:
      OneCycleLR:
        max_lr: 1.0e-4
        pct_start: 0.3
        div_factor: 10
        final_div_factor: 100
